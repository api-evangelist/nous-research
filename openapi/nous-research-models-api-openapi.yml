openapi: 3.2.0
info:
  title: Nous Research Inference API (Nous Portal) Models API
  version: v1
  description: OpenAI-compatible inference API served by Nous Research at https://inference-api.nousresearch.com/v1.
  x-source: https://inference-api.nousresearch.com/v1
  x-derived-by: api-evangelist enrichment pipeline (live probe)
servers:
- url: https://inference-api.nousresearch.com/v1
  description: Nous Research inference API (production)
security:
- bearerAuth: []
tags:
- name: Models
  description: Model discovery and catalog.
paths:
  /models:
    get:
      tags:
      - Models
      operationId: listModels
      summary: List available models
      description: Returns the catalog of models available through the Nous Research inference API, including id, pricing, context length, architecture (input/output modalities), and supported parameters. Public — no authentication required (verified 200 without credentials).
      security: []
      responses:
        '200':
          description: The list of available models.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelList'
components:
  schemas:
    ModelList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Model'
      required:
      - data
    Model:
      type: object
      description: A model available through the inference API.
      properties:
        id:
          type: string
          example: nousresearch/hermes-4-405b
        canonical_slug:
          type: string
        hugging_face_id:
          type: string
        name:
          type: string
        description:
          type: string
        context_length:
          type: integer
        architecture:
          type: object
          properties:
            modality:
              type: string
            input_modalities:
              type: array
              items:
                type: string
            output_modalities:
              type: array
              items:
                type: string
            tokenizer:
              type: string
        pricing:
          type: object
          description: Per-token prices in USD (string decimals).
          properties:
            prompt:
              type: string
            completion:
              type: string
            input_cache_read:
              type: string
        supported_parameters:
          type: array
          items:
            type: string
      required:
      - id
      - name
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Nous Portal API key supplied as: Authorization: Bearer <key>'
