aid: nous-research
name: Nous Research
description: >-
  Nous Research is an AI research and infrastructure company ("The AI Accelerator
  Company") known for the open-weight Hermes family of language models (including
  Hermes 4) and for Nous Portal, an OpenAI-compatible inference API served at
  inference-api.nousresearch.com. The Portal aggregates Nous's own Hermes models
  alongside a broad catalog of open and frontier third-party models (OpenRouter-
  style routing, 280+ models) behind a single chat-completions endpoint.
  Distinctively, the inference API supports the x402 HTTP payment protocol,
  returning HTTP 402 with a Solana USDC micropayment envelope so agents can pay
  per request without a pre-provisioned account. Beyond inference, Nous ships the
  Hermes Agent framework, Atropos RL environments, and Psyche/DisTrO for
  distributed model training over the internet. Backed by Paradigm.
